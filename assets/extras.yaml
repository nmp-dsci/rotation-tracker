# assets/v1: the hand-kept part of the stock layer.
#
# The listings give every US ticker and, for S&P 500 and Nasdaq-100 members, a company name.
# This file adds what they cannot: how he actually says a name (nicknames, short forms,
# auto-caption mishearings), and which generated names are also ordinary words. New entries come
# from the unknown-asset queue (`rt assets unknown`); each one should get a resolver test.
version: assets/v1

# ticker → extra spoken forms (normalised: lower case, words only).
